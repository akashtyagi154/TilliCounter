<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ledger Pro - Info Enhanced</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f0f2f5; --timer: #34495e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 5px; display: flex; justify-content: center; transition: background 0.2s; -webkit-tap-highlight-color: transparent; }
        .container { width: 100%; max-width: 800px; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1; box-sizing: border-box; }
        
        .flash-active { background-color: var(--danger) !important; }
        h1, h2 { text-align: center; color: var(--primary); margin: 10px 0; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        /* Timer Styles */
        .timer-container { text-align: center; background: var(--timer); color: white; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        #display { font-family: monospace; font-size: 2.2rem; font-weight: bold; margin-bottom: 8px; display: block; color: #ecf0f1; }
        .timer-controls { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        .timer-btn { background: rgba(255,255,255,0.2); font-size: 0.75rem; padding: 8px 10px; color: white; border: none; border-radius: 5px; cursor: pointer; flex: 1 1 20%; min-width: 45px; }
        #startStop { width: 100%; font-size: 1.1rem; padding: 14px; margin: 10px auto; background: var(--accent); display: block; text-transform: uppercase; color: white; border: none; border-radius: 8px; cursor: pointer; }
        #startStop.running { background: #f39c12; }

        /* General UI - Mobile Optimized Controls */
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
        input[type="text"], input[type="number"], select { flex: 1; min-width: 80px; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        button { border: none; border-radius: 8px; padding: 12px 14px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-main { background: var(--primary); color: white; flex: 1 1 45%; }
        .btn-sec { background: #edf2f7; color: var(--primary); flex: 1 1 45%; }
        .btn-add { background: var(--accent); color: white; width: 100%; }
        .btn-danger { background: #fee2e2; color: var(--danger); width: 100%; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 10px 0; table-layout: fixed; }
        th { background: #f1f5f9; padding: 8px 4px; overflow: hidden; text-overflow: ellipsis; }
        td { padding: 8px 2px; text-align: center; border-bottom: 1px solid #eee; overflow: hidden; }
        .total-row { background: #f8fafc; font-weight: bold; border-top: 2px solid #cbd5e1; }
        
        /* Vertically Stacked Stepper */
        .stepper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        .stepper button { padding: 10px 20px; border-radius: 6px; background: #e2e8f0; color: #475569; width: 100%; max-width: 60px; font-size: 1.2rem; }
        .stepper input { width: 50px; text-align: center; border: none; font-weight: bold; background: transparent; padding: 5px 0; font-size: 1.3rem; }
        
        .tally-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-top: 10px; overflow-x: auto; }
        
        /* Chart Card & Info Button */
        .chart-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        .chart-card { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 8px; height: 250px; position: relative; }
        .info-btn { position: absolute; top: 5px; right: 5px; background: #e2e8f0; color: #475569; border-radius: 50%; width: 22px; height: 22px; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; border: none; font-weight: bold; }

        /* Popup Styles */
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .popup-content { background: white; padding: 20px; border-radius: 12px; max-width: 85%; width: 300px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .popup-content h3 { margin-top: 0; color: var(--primary); font-size: 1.1rem; }
        .popup-content p { color: #555; line-height: 1.4; font-size: 0.9rem; }
        .close-popup { margin-top: 15px; width: 100%; }

        .hidden { display: none; }
        .positive { color: var(--accent); font-weight: bold; }
        .negative { color: var(--danger); font-weight: bold; }
        #historyLog { max-height: 200px; overflow-y: auto; font-size: 0.8rem; padding: 10px; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; }
        .hist-entry { border-bottom: 1px solid #eee; padding: 8px 0; word-wrap: break-word; }
        .hist-rounds { font-size: 0.7rem; color: #666; margin-top: 4px; font-style: italic; }

        @media (min-width: 600px) {
            .chart-grid { grid-template-columns: repeat(2, 1fr); }
            h1, h2 { font-size: 1.4rem; }
            .timer-btn { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div id="infoPopup" class="popup-overlay" onclick="closePopup()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <h3 id="popupTitle">Chart Info</h3>
        <p id="popupText">Description goes here.</p>
        <button class="btn-main close-popup" onclick="closePopup()">Got it</button>
    </div>
</div>

<div class="container">
    <div class="timer-container">
        <span id="display">00:00:00</span>
        <div class="timer-controls">
            <button class="timer-btn" onclick="adjTimer(60)">+1m</button>
            <button class="timer-btn" onclick="adjTimer(-60)">-1m</button>
            <button class="timer-btn" onclick="adjTimer(30)">+30s</button>
            <button class="timer-btn" onclick="adjTimer(-30)">-30s</button>
        </div>
        <div class="timer-controls">
            <button class="timer-btn" onclick="adjTimer(15)">+15s</button>
            <button class="timer-btn" onclick="adjTimer(-15)">-15s</button>
            <button class="timer-btn" onclick="adjTimer(5)">+5s</button>
            <button class="timer-btn" onclick="adjTimer(-5)">-5s</button>
        </div>
        <button id="startStop" onclick="startStop()">Start</button>
        <button class="timer-btn" style="width:100%; margin-top:5px;" onclick="resetTimer()">Reset Timer</button>
    </div>

    <h1>🏆 Game Tracker Pro</h1>

    <div class="section">
        <div class="controls">
            <input type="text" id="playerName" placeholder="Player Name">
            <button class="btn-add" onclick="addPlayer()" style="width:auto; flex:0;">Add</button>
        </div>
        <div class="controls">
            <button class="btn-main" onclick="showGameUI()">New Match</button>
            <button class="btn-sec" onclick="exportData()">Export</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">Import</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            <button class="btn-danger" onclick="clearSession()">Reset All</button>
        </div>
    </div>

    <div id="gameSection" class="section hidden">
        <h2>Active Match</h2>
        <div class="controls">
            <select id="p1S" onchange="changeActivePlayers()"></select>
            <select id="p2S" onchange="changeActivePlayers()"></select>
            <select id="p3S" onchange="changeActivePlayers()"></select>
        </div>
        
        <div class="chart-card" style="margin-bottom: 15px;">
            <button class="info-btn" onclick="showInfo('Match Chart', 'Visualizes point distribution for this match.')">i</button>
            <canvas id="matchChart"></canvas>
        </div>

        <h3 id="roundTitle" style="text-align:center">Round 1</h3>
        <table>
            <thead><tr><th id="h1">P1</th><th id="h2">P2</th><th id="h3">P3</th></tr></thead>
            <tbody><tr>
                <td><div class="stepper"><button onclick="step('v1',1)">+</button><input type="number" id="v1" value="0" readonly><button onclick="step('v1',-1)">-</button></div></td>
                <td><div class="stepper"><button onclick="step('v2',1)">+</button><input type="number" id="v2" value="0" readonly><button onclick="step('v2',-1)">-</button></div></td>
                <td><div class="stepper"><button onclick="step('v3',1)">+</button><input type="number" id="v3" value="0" readonly><button onclick="step('v3',-1)">-</button></div></td>
            </tr></tbody>
        </table>

        <div class="tally-box">
            <table style="background: white;">
                <thead><tr><th style="width:20%">Rd</th><th id="l1">P1</th><th id="l2">P2</th><th id="l3">P3</th></tr></thead>
                <tbody id="roundLogs"></tbody>
                <tfoot>
                    <tr class="total-row"><td>TOT</td><td id="t1">0</td><td id="t2">0</td><td id="t3">0</td></tr>
                </tfoot>
            </table>
        </div>
        <button class="btn-add" style="width: 100%; margin-top: 15px; padding: 16px;" id="roundBtn" onclick="submitRound()">Submit Round</button>
    </div>

    <div class="section">
        <h2>📊 Analytics</h2>
        <div class="chart-grid">
            <div class="chart-card">
                <button class="info-btn" onclick="showInfo('Total Balances', 'Total current score per player.')">i</button>
                <canvas id="balanceChart"></canvas>
            </div>
            <div class="chart-card">
                <button class="info-btn" onclick="showInfo('Balance Trend', 'Score evolution over time.')">i</button>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart-card">
                <button class="info-btn" onclick="showInfo('Contribution', 'Points from last 5 matches.')">i</button>
                <canvas id="stackedBarChart"></canvas>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Balances</h2>
        <table><thead><tr><th>Player</th><th>Balance</th></tr></thead><tbody id="balanceBody"></tbody></table>
    </div>
    
    <div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>History</h2>
            <button class="btn-sec" style="font-size: 0.7rem; padding: 6px 10px; flex:none;" onclick="undoLastMatch()">Undo Last</button>
        </div>
        <div id="historyLog"></div>
    </div>
</div>

<script>
    let timer, totalSeconds = 0, isRunning = false, isCountdown = false;
    let players = JSON.parse(localStorage.getItem('players')) || {};
    let history = JSON.parse(localStorage.getItem('history')) || [];
    let activeMatch = JSON.parse(localStorage.getItem('activeMatch')) || null;
    let chartObjects = {};

    function showInfo(title, text) {
        document.getElementById('popupTitle').innerText = title;
        document.getElementById('popupText').innerText = text;
        document.getElementById('infoPopup').style.display = 'flex';
    }
    function closePopup() { document.getElementById('infoPopup').style.display = 'none'; }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function speakReminders(text) { if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }
    function playBeep(freq, duration) {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination); osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playAlarm() { playBeep(880, 0.5); setTimeout(() => playBeep(880, 0.5), 600); setTimeout(() => { playBeep(880, 1.0); speakReminders("Time is up"); }, 1200); }
    function formatTime(s) { let h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
    function adjTimer(v) { if(isRunning) return; totalSeconds = Math.max(0, totalSeconds + v); isCountdown = totalSeconds > 0; document.getElementById("display").innerText = formatTime(totalSeconds); }
    
    function startStop() { 
        if(audioCtx.state === 'suspended') audioCtx.resume(); 
        const btn = document.getElementById("startStop"); 
        if(!isRunning){ 
            if(isCountdown && totalSeconds<=0) return; 
            playBeep(660, 0.2); // Sound when starting
            timer=setInterval(tick,1000); 
            isRunning=true; 
            btn.innerText="Pause"; 
            btn.classList.add('running'); 
        } else { 
            clearInterval(timer); 
            isRunning=false; 
            btn.innerText="Start"; 
            btn.classList.remove('running'); 
        } 
    }

    function tick() { if(isCountdown){ totalSeconds--; if (totalSeconds === 60) speakReminders("One minute remaining"); else if (totalSeconds === 30) speakReminders("Thirty seconds remaining"); else if (totalSeconds <= 10 && totalSeconds > 0) speakReminders(totalSeconds.toString()); if(totalSeconds<=0){ clearInterval(timer); triggerFlash(); playAlarm(); totalSeconds=0; isRunning=false; resetTimer(); } } else { totalSeconds++; } document.getElementById("display").innerText = formatTime(totalSeconds); }
    function triggerFlash() { let c=0, i=setInterval(()=>{ document.body.classList.toggle('flash-active'); if(++c>12){ clearInterval(i); document.body.classList.remove('flash-active'); }}, 150); }
    function resetTimer() { clearInterval(timer); totalSeconds=0; isRunning=false; isCountdown=false; document.getElementById("display").innerText="00:00:00"; document.getElementById("startStop").innerText="Start"; document.getElementById("startStop").classList.remove('running'); }

    function initCharts() {
        const commonOptions = { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false } };
        const createChart = (id, type, label, bg, extraOpts = {}) => {
            return new Chart(document.getElementById(id), {
                type: type, data: { labels: [], datasets: [{ label: label, data: [], backgroundColor: bg }] },
                options: { ...commonOptions, ...extraOpts, plugins: { legend: { display: true }, title: { display: true, text: label } } }
            });
        };
        chartObjects.balance = createChart('balanceChart', 'bar', 'Total Balances', '#3498db');
        chartObjects.trend = createChart('trendChart', 'line', 'Balance Trend', '#27ae60');
        chartObjects.stacked = createChart('stackedBarChart', 'bar', 'Match Contribution', '#95a5a6');
        chartObjects.match = new Chart(document.getElementById('matchChart'), {
            type: 'radar', data: { labels: ['P1', 'P2', 'P3'], datasets: [{ label: 'Current Match Points', data: [0,0,0], borderColor: '#27ae60', backgroundColor: 'rgba(39, 174, 96, 0.2)' }] },
            options: { ...commonOptions, scales: { r: { suggestMin: 0, suggestMax: 10 } } }
        });
    }

    function updateCharts() {
        const names = Object.keys(players).sort();
        const vals = names.map(n => players[n]);
        chartObjects.balance.data.labels = names; chartObjects.balance.data.datasets[0].data = vals; chartObjects.balance.update();
        chartObjects.trend.data.labels = history.map((_, i) => i + 1);
        const datasets = names.map((name, idx) => {
            let runningTotal = 0;
            const data = history.map(curr => { runningTotal += (curr.diffs[name] || 0); return runningTotal; });
            return { label: name, data: data, borderColor: `hsl(${idx * 110}, 70%, 50%)`, backgroundColor: `hsla(${idx * 110}, 70%, 50%, 0.3)`, fill: false, tension: 0.3 };
        });
        chartObjects.trend.data.datasets = datasets; chartObjects.trend.update();
        chartObjects.stacked.data.labels = history.slice(-5).map((_, i) => `M${history.length - 4 + i}`);
        chartObjects.stacked.data.datasets = names.map((name, idx) => ({ label: name, data: history.slice(-5).map(h => h.diffs[name] || 0), backgroundColor: `hsl(${idx * 110}, 70%, 70%)` }));
        chartObjects.stacked.options.scales.x = { stacked: true }; chartObjects.stacked.options.scales.y = { stacked: true };
        chartObjects.stacked.update();
    }

    function save() { 
        localStorage.setItem('players', JSON.stringify(players)); 
        localStorage.setItem('history', JSON.stringify(history)); 
        localStorage.setItem('activeMatch', JSON.stringify(activeMatch));
        renderBalance(); renderHistory(); updateCharts(); 
    }
    function addPlayer() { let n = document.getElementById('playerName').value.trim(); if(n && !players[n]){ players[n]=0; document.getElementById('playerName').value=''; save(); } }
    function step(id, v) { let el = document.getElementById(id); el.value = (parseInt(el.value)||0) + v; }
    
    function showGameUI() {
        let names = Object.keys(players); if(names.length < 3) return alert("Need 3 players!");
        document.getElementById('gameSection').classList.remove('hidden');
        if(!activeMatch) { activeMatch = { pNames: [names[0], names[1], names[2]], round: 1, tally: [0, 0, 0], rounds: [] }; }
        populateSelectors(); refreshMatchUI();
    }
    function populateSelectors() {
        let names = Object.keys(players);
        ['p1S','p2S','p3S'].forEach((sId, i) => {
            let s = document.getElementById(sId); s.innerHTML = '';
            names.forEach(n => s.innerHTML += `<option value="${n}" ${activeMatch.pNames[i]==n?'selected':''}>${n}</option>`);
        });
    }
    function changeActivePlayers() {
        activeMatch.pNames = [document.getElementById('p1S').value, document.getElementById('p2S').value, document.getElementById('p3S').value];
        refreshMatchUI();
    }
    function refreshMatchUI() {
        if(!activeMatch) return;
        ['h1','h2','h3','l1','l2','l3'].forEach((id, i) => document.getElementById(id).innerText = activeMatch.pNames[i % 3]);
        document.getElementById('roundTitle').innerText = `Round ${activeMatch.round}`;
        document.getElementById('roundBtn').innerText = `Submit Round ${activeMatch.round}`;
        ['t1','t2','t3'].forEach((id, i) => document.getElementById(id).innerText = activeMatch.tally[i]);
        let logs = document.getElementById('roundLogs'); logs.innerHTML = '';
        activeMatch.rounds.forEach((rd, idx) => { logs.insertRow().innerHTML = `<td>R${idx+1}</td><td>${rd[0]}</td><td>${rd[1]}</td><td>${rd[2]}</td>`; });
        chartObjects.match.data.labels = activeMatch.pNames; chartObjects.match.data.datasets[0].data = activeMatch.tally; chartObjects.match.update();
        save();
    }
    function submitRound() {
        let v = [parseInt(document.getElementById('v1').value), parseInt(document.getElementById('v2').value), parseInt(document.getElementById('v3').value)];
        if(v[0] + v[1] + v[2] !== 5) return alert("Round sum must be 5!");
        activeMatch.rounds.push([...v]);
        v.forEach((s, i) => activeMatch.tally[i] += s);
        document.getElementById('v1').value = 0; document.getElementById('v2').value = 0; document.getElementById('v3').value = 0;
        if(activeMatch.round < 3) { 
            activeMatch.round++; 
            refreshMatchUI(); 
        } else { finishMatch(); }
    }
    function finishMatch() {
        let diffs = {}; activeMatch.pNames.forEach((n, i) => { let d = activeMatch.tally[i] - 5; players[n] += d; diffs[n] = d; });
        history.push({ log: `M#${history.length+1}: ${activeMatch.pNames.map((n,i)=>`${n}(${activeMatch.tally[i]})`).join(' ')}`, diffs, fullData: { players: [...activeMatch.pNames], rounds: [...activeMatch.rounds], finalTally: [...activeMatch.tally] } });
        speakReminders("Match finished."); activeMatch = null; document.getElementById('gameSection').classList.add('hidden'); save();
    }
    function renderHistory() {
        document.getElementById('historyLog').innerHTML = history.slice().reverse().map(h => {
            let rdHtml = h.fullData ? `<div class="hist-rounds">Rounds: ${h.fullData.rounds.map(r => `[${r.join(',')}]`).join(' ')}</div>` : '';
            return `<div class="hist-entry"><strong>${h.log}</strong>${rdHtml}</div>`;
        }).join('');
    }
    function undoLastMatch() { if(history.length === 0) return alert("Nothing to undo!"); let last = history.pop(); for(let n in last.diffs) players[n] -= last.diffs[n]; save(); }
    function exportData() { const data = { players, history, activeMatch }; const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'game_ledger_backup.json'; a.click(); }
    function importData(e) {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader(); reader.onload = (ev) => {
            try { const data = JSON.parse(ev.target.result); players = data.players || {}; history = data.history || []; activeMatch = data.activeMatch || null; save(); location.reload(); } catch(err) { alert("Invalid file"); }
        }; reader.readAsText(file);
    }
    function renderBalance() {
        let b = document.getElementById('balanceBody'); b.innerHTML = '';
        Object.keys(players).sort().forEach(n => {
            let r = b.insertRow(); r.insertCell(0).innerText = n;
            let c = r.insertCell(1); c.innerText = players[n]; c.className = players[n]>=0?'positive':'negative';
        });
    }
    function clearSession() { if(confirm("Clear everything?")) { localStorage.clear(); location.reload(); } }

    initCharts(); renderBalance(); renderHistory(); updateCharts();
    if(activeMatch) showGameUI();
</script>
</body>
</html>
