<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ledger Pro + Visuals</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f8f9fa; --timer: #34495e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; transition: background 0.2s; }
        .container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .flash-active { background: var(--danger) !important; }
        h1, h2 { text-align: center; color: var(--primary); margin-bottom: 15px; font-size: 1.4rem; }
        .section { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        /* Timer & UI */
        .timer-container { text-align: center; background: var(--timer); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        #display { font-family: monospace; font-size: 2.2rem; font-weight: bold; margin-bottom: 10px; display: block; }
        .timer-controls { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; align-items: center; }
        .timer-btn { background: rgba(255,255,255,0.2); font-size: 0.8rem; padding: 6px 12px; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .timer-input { width: 50px; padding: 4px; border-radius: 4px; border: none; text-align: center; font-weight: bold; }
        
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
        input[type="text"] { flex: 1; min-width: 150px; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; }
        button { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sec { background: #edf2f7; color: var(--primary); }
        .btn-add { background: var(--accent); color: white; }
        .btn-danger { background: #fee2e2; color: var(--danger); }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #f1f5f9; padding: 10px; border-radius: 4px; }
        td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #f1f5f9; }
        
        .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
        .stepper button { padding: 4px 8px; border-radius: 4px; background: #e2e8f0; color: #475569; font-size: 1rem; }
        .stepper input { width: 40px; text-align: center; border: none; font-weight: bold; font-size: 1rem; background: transparent; }
        
        .tally-box { background: #fdf2f2; border: 1px solid #fee2e2; border-radius: 8px; padding: 10px; margin-top: 10px; text-align: center; }
        .chart-container { margin: 20px 0; height: 250px; }
        .hidden { display: none; }
        .positive { color: var(--accent); font-weight: bold; }
        .negative { color: var(--danger); font-weight: bold; }
        #historyLog { max-height: 150px; overflow-y: auto; font-size: 0.85rem; padding: 10px; background: #fdfdfd; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="timer-container">
        <span id="display">00:00:00</span>
        <div class="timer-controls">
            <button class="timer-btn" onclick="adjTimer(-5)">-5s</button>
            <input type="number" id="setMins" class="timer-input" placeholder="Min">
            <button class="timer-btn" onclick="adjTimer(5)">+5s</button>
            <button class="timer-btn" onclick="setCountdown()">Set</button>
        </div>
        <div class="timer-controls">
            <button class="timer-btn" id="startStop" onclick="startStop()">Start</button>
            <button class="timer-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <h1>🏆 Game Tracker</h1>

    <div class="section">
        <div class="controls">
            <input type="text" id="playerName" placeholder="Player Name">
            <button class="btn-add" onclick="addPlayer()">Add</button>
        </div>
        <div class="controls">
            <button class="btn-main" onclick="showGameUI()">New Match</button>
            <button class="btn-sec" onclick="exportToCSV()">Export</button>
            <button class="btn-danger" onclick="clearSession()">Reset Data</button>
        </div>
    </div>

    <div id="gameSection" class="section hidden">
        <h2 id="matchDisplay">Match #1</h2>
        <div class="controls"><select id="p1S"></select><select id="p2S"></select><select id="p3S"></select></div>
        <div class="chart-container"><canvas id="matchChart"></canvas></div>
        <h3 id="roundTitle" style="text-align:center">Round 1</h3>
        <table>
            <thead><tr><th id="h1">P1</th><th id="h2">P2</th><th id="h3">P3</th></tr></thead>
            <tbody><tr>
                <td><div class="stepper"><button onclick="step('v1',-1)">-</button><input type="number" id="v1" value="0" readonly><button onclick="step('v1',1)">+</button></div></td>
                <td><div class="stepper"><button onclick="step('v2',-1)">-</button><input type="number" id="v2" value="0" readonly><button onclick="step('v2',1)">+</button></div></td>
                <td><div class="stepper"><button onclick="step('v3',-1)">-</button><input type="number" id="v3" value="0" readonly><button onclick="step('v3',1)">+</button></div></td>
            </tr></tbody>
        </table>
        <div class="tally-box"><strong>Match Tally:</strong> <span id="tallyText">0 | 0 | 0</span></div>
        <button class="btn-add" style="width: 100%; margin-top: 15px;" id="roundBtn" onclick="submitRound()">Submit Round 1</button>
    </div>

    <div class="section">
        <h2>Balances</h2>
        <div class="chart-container"><canvas id="balanceChart"></canvas></div>
        <table><thead><tr><th>Player</th><th>Balance</th></tr></thead><tbody id="balanceBody"></tbody></table>
    </div>
    
    <div><h2>History</h2><div id="historyLog"></div></div>
</div>

<script>
    let timer, totalSeconds = 0, isRunning = false, isCountdown = false;
    let players = JSON.parse(localStorage.getItem('players')) || {};
    let history = JSON.parse(localStorage.getItem('history')) || [];
    let currentMatch = { pNames: [], round: 1, tally: [0, 0, 0] };
    let balanceChartObj, matchChartObj;

    // Timer & UI Logic (Same as before)
    function formatTime(s) { let h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
    function adjTimer(v) { if(isRunning) return; totalSeconds = Math.max(0, totalSeconds + v); isCountdown = true; document.getElementById("display").innerText = formatTime(totalSeconds); }
    function setCountdown() { let mins = parseInt(document.getElementById('setMins').value)||0; if(mins<=0) return; resetTimer(); totalSeconds = mins*60; isCountdown = true; document.getElementById("display").innerText = formatTime(totalSeconds); }
    function startStop() { if(!isRunning){ if(isCountdown && totalSeconds<=0) return; timer=setInterval(tick,1000); isRunning=true; document.getElementById("startStop").innerText="Pause"; } else { clearInterval(timer); isRunning=false; document.getElementById("startStop").innerText="Start"; } }
    function tick() { if(isCountdown){ totalSeconds--; if(totalSeconds<=0){ clearInterval(timer); triggerFlash(); totalSeconds=0; isRunning=false; document.getElementById("startStop").innerText="Start"; } } else { totalSeconds++; } document.getElementById("display").innerText = formatTime(totalSeconds); }
    function triggerFlash() { let c=0, i=setInterval(()=>{ document.body.classList.toggle('flash-active'); if(++c>10){ clearInterval(i); document.body.classList.remove('flash-active'); }}, 200); }
    function resetTimer() { clearInterval(timer); totalSeconds=0; isRunning=false; isCountdown=false; document.getElementById("display").innerText="00:00:00"; document.getElementById("startStop").innerText="Start"; }

    // Chart Logic
    function initCharts() {
        const ctxB = document.getElementById('balanceChart').getContext('2d');
        balanceChartObj = new Chart(ctxB, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Balance', data: [], backgroundColor: '#3498db' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
        const ctxM = document.getElementById('matchChart').getContext('2d');
        matchChartObj = new Chart(ctxM, {
            type: 'radar',
            data: { labels: ['P1', 'P2', 'P3'], datasets: [{ label: 'Match Points', data: [0,0,0], backgroundColor: 'rgba(39, 174, 96, 0.2)', borderColor: '#27ae60' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { r: { suggestMin: 0, suggestMax: 10 } } }
        });
    }

    function updateCharts() {
        const names = Object.keys(players).sort();
        balanceChartObj.data.labels = names;
        balanceChartObj.data.datasets[0].data = names.map(n => players[n]);
        balanceChartObj.update();
    }

    // Game Logic
    function save() { localStorage.setItem('players', JSON.stringify(players)); localStorage.setItem('history', JSON.stringify(history)); renderBalance(); renderHistory(); updateCharts(); }
    function addPlayer() { let n = document.getElementById('playerName').value.trim(); if(n && !players[n]){ players[n]=0; document.getElementById('playerName').value=''; save(); } }
    function step(id, v) { let el = document.getElementById(id); el.value = (parseInt(el.value)||0) + v; }
    
    function showGameUI() {
        let names = Object.keys(players); if(names.length < 3) return alert("Need 3 players!");
        document.getElementById('gameSection').classList.remove('hidden');
        currentMatch = { pNames: [], round: 1, tally: [0, 0, 0] };
        ['p1S','p2S','p3S'].forEach((sId, i) => {
            let s = document.getElementById(sId); s.innerHTML = '';
            names.forEach(n => s.innerHTML += `<option value="${n}" ${i==names.indexOf(n)?'selected':''}>${n}</option>`);
        });
        updateMatchUI();
    }

    function updateMatchUI() {
        currentMatch.pNames = [document.getElementById('p1S').value, document.getElementById('p2S').value, document.getElementById('p3S').value];
        document.getElementById('h1').innerText = currentMatch.pNames[0];
        document.getElementById('h2').innerText = currentMatch.pNames[1];
        document.getElementById('h3').innerText = currentMatch.pNames[2];
        document.getElementById('roundTitle').innerText = `Round ${currentMatch.round}`;
        document.getElementById('roundBtn').innerText = `Submit Round ${currentMatch.round}`;
        document.getElementById('tallyText').innerText = currentMatch.tally.join(' | ');
        document.getElementById('v1').value = 0; document.getElementById('v2').value = 0; document.getElementById('v3').value = 0;
        matchChartObj.data.labels = currentMatch.pNames;
        matchChartObj.data.datasets[0].data = currentMatch.tally;
        matchChartObj.update();
    }

    document.getElementById('p1S').onchange = updateMatchUI;
    document.getElementById('p2S').onchange = updateMatchUI;
    document.getElementById('p3S').onchange = updateMatchUI;

    function submitRound() {
        let v1 = parseInt(document.getElementById('v1').value)||0, v2 = parseInt(document.getElementById('v2').value)||0, v3 = parseInt(document.getElementById('v3').value)||0;
        if(v1 + v2 + v3 !== 5) return alert("Round sum must be 5!");
        currentMatch.tally[0] += v1; currentMatch.tally[1] += v2; currentMatch.tally[2] += v3;
        if(currentMatch.round < 3) { currentMatch.round++; updateMatchUI(); } 
        else { finishMatch(); }
    }

    function finishMatch() {
        let losers = [], winners = [];
        currentMatch.pNames.forEach((name, i) => {
            let diff = currentMatch.tally[i] - 5;
            players[name] += diff;
            if(diff < 0) losers.push({name, amt: Math.abs(diff)});
            else if(diff > 0) winners.push({name, amt: diff});
        });
        let tilliText = "";
        losers.forEach(l => { winners.forEach(w => { let pay = Math.min(l.amt, w.amt); if(pay > 0) { tilliText += `• ${l.name} gives ${pay} Tilli to ${w.name}\n`; l.amt -= pay; w.amt -= pay; } }); });
        alert(`Match Final Summary:\n\n` + (tilliText || "No exchange needed"));
        history.push(`M#${history.length+1}: ${currentMatch.pNames[0]}(${currentMatch.tally[0]}) ${currentMatch.pNames[1]}(${currentMatch.tally[1]}) ${currentMatch.pNames[2]}(${currentMatch.tally[2]})`);
        document.getElementById('gameSection').classList.add('hidden');
        save();
    }

    function renderBalance() {
        let b = document.getElementById('balanceBody'); b.innerHTML = '';
        Object.keys(players).sort().forEach(n => {
            let r = b.insertRow(); r.insertCell(0).innerText = n;
            let c = r.insertCell(1); c.innerText = players[n]; c.className = players[n]>=0?'positive':'negative';
        });
    }
    function renderHistory() { document.getElementById('historyLog').innerHTML = history.slice().reverse().map(h => `<div style="padding:4px 0; border-bottom:1px solid #eee">${h}</div>`).join(''); }
    function exportToCSV() { let csv = "Player,Balance\n" + Object.entries(players).map(e=>e.join(",")).join("\n"); let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'game_data.csv'; a.click(); }
    function clearSession() { if(confirm("Wipe all data?")) { players={}; history=[]; localStorage.clear(); save(); location.reload(); } }

    initCharts(); renderBalance(); renderHistory(); updateCharts();
</script>
</body>
</html>
