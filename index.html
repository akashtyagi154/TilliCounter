<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Ledger Pro - Elite Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; 
            --bg: #f0f2f5; --card: #ffffff; --text: #2c3e50; --timer: #34495e;
            --border: #eeeeee; --table-head: #f1f5f9;
        }
        [data-theme="dark"] {
            --primary: #ecf0f1; --accent: #2ecc71; --danger: #e74c3c; 
            --bg: #1a1a1a; --card: #2d2d2d; --text: #f0f0f0; --timer: #000000;
            --border: #444444; --table-head: #3d3d3d;
        }
        
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; display: flex; justify-content: center; transition: all 0.3s; }
        .container { width: 100%; max-width: 800px; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .theme-toggle { position: fixed; top: 20px; right: 20px; cursor: pointer; background: var(--primary); color: var(--bg); padding: 8px 12px; border-radius: 20px; border: none; font-weight: bold; }

        h1, h2 { text-align: center; color: var(--text); margin: 15px 0; font-size: 1.4rem; border-bottom: 2px solid var(--border); padding-bottom: 5px; }
        .section { margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        /* Timer */
        .timer-container { text-align: center; background: var(--timer); color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        #display { font-family: monospace; font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; display: block; }
        .timer-btn { background: rgba(255,255,255,0.2); font-size: 0.8rem; padding: 6px 12px; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 2px; }
        #startStop { width: 80%; font-size: 1.3rem; padding: 12px; margin: 10px auto; background: var(--accent); display: block; color: white; border: none; border-radius: 8px; cursor: pointer; }

        /* Controls */
        .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 15px; }
        input, select { padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); }
        button { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: var(--bg); }
        .btn-add { background: var(--accent); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sec { background: var(--table-head); color: var(--text); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 10px 0; }
        th { background: var(--table-head); padding: 10px; }
        td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); }
        .score-high { background: rgba(39, 174, 96, 0.2); }
        .score-low { background: rgba(231, 76, 60, 0.2); }
        
        .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; }
        .stepper button { padding: 4px 8px; background: var(--table-head); color: var(--text); }
        
        /* Charts */
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; height: 300px; position: relative; }
        .info-btn { position: absolute; top: 8px; right: 8px; background: var(--table-head); color: var(--text); border-radius: 50%; width: 20px; height: 20px; font-size: 12px; border: none; cursor: pointer; }

        /* Popups */
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .popup-content { background: var(--card); padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; color: var(--text); }

        .hidden { display: none; }
        .positive { color: var(--accent); }
        .negative { color: var(--danger); }
        #historyLog { max-height: 250px; overflow-y: auto; background: var(--table-head); padding: 10px; border-radius: 8px; }
        .win-badge { color: gold; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>

<div id="infoPopup" class="popup-overlay" onclick="closePopup()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <h3 id="popupTitle">Info</h3>
        <p id="popupText"></p>
        <button class="btn-main" onclick="closePopup()" style="width:100%">Got it</button>
    </div>
</div>

<div class="container">
    <div class="timer-container">
        <span id="display">00:00:00</span>
        <div class="timer-controls">
            <button class="timer-btn" onclick="adjTimer(60)">+1m</button>
            <button class="timer-btn" onclick="adjTimer(-60)">-1m</button>
            <button class="timer-btn" onclick="adjTimer(30)">+30s</button>
            <button class="timer-btn" onclick="adjTimer(-30)">-30s</button>
            <button class="timer-btn" onclick="adjTimer(15)">+15s</button>
            <button class="timer-btn" onclick="adjTimer(5)">+5s</button>
        </div>
        <button id="startStop" onclick="startStop()">Start</button>
        <button class="timer-btn" onclick="resetTimer()">Reset Timer</button>
    </div>

    <h1>🏆 Game Tracker Pro</h1>

    <div class="section">
        <div class="controls">
            <input type="text" id="playerName" placeholder="Player Name">
            <button class="btn-add" onclick="addPlayer()">Add Player</button>
        </div>
        <div class="controls">
            <button class="btn-main" onclick="showGameUI()">New Match</button>
            <button class="btn-sec" onclick="exportData()">Export (JSON)</button>
            <button class="btn-sec" onclick="copyJSON()">Copy JSON</button>
            <button class="btn-sec" onclick="document.getElementById('importFile').click()">Import</button>
            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            <button class="btn-danger" onclick="clearSession()">Reset Data</button>
        </div>
    </div>

    <div id="gameSection" class="section hidden">
        <h2>Active Match</h2>
        <div class="controls">
            <select id="p1S" onchange="syncSelectors(0)"></select>
            <select id="p2S" onchange="syncSelectors(1)"></select>
            <select id="p3S" onchange="syncSelectors(2)"></select>
        </div>
        
        <div class="chart-card" style="margin-bottom:15px">
            <button class="info-btn" onclick="showInfo('Live Match', 'Radar of points for current game.')">i</button>
            <canvas id="matchChart"></canvas>
        </div>

        <h3 id="roundTitle" style="text-align:center">Round 1</h3>
        <table>
            <thead><tr><th id="h1">P1</th><th id="h2">P2</th><th id="h3">P3</th></tr></thead>
            <tbody><tr>
                <td><div class="stepper"><button onclick="step('v1',-1)">-</button><input type="number" id="v1" value="0" readonly><button onclick="step('v1',1)">+</button></div></td>
                <td><div class="stepper"><button onclick="step('v2',-1)">-</button><input type="number" id="v2" value="0" readonly><button onclick="step('v2',1)">+</button></div></td>
                <td><div class="stepper"><button onclick="step('v3',-1)">-</button><input type="number" id="v3" value="0" readonly><button onclick="step('v3',1)">+</button></div></td>
            </tr></tbody>
        </table>

        <div class="tally-box">
            <table>
                <thead><tr><th>Round</th><th id="l1">P1</th><th id="l2">P2</th><th id="l3">P3</th></tr></thead>
                <tbody id="roundLogs"></tbody>
                <tfoot><tr class="total-row"><td>TOTAL</td><td id="t1">0</td><td id="t2">0</td><td id="t3">0</td></tr></tfoot>
            </table>
        </div>
        <button class="btn-add" style="width:100%; margin-top:15px" id="roundBtn" onclick="submitRound()">Submit Round</button>
    </div>

    <div class="section">
        <h2>📊 Performance Analytics</h2>
        <div class="chart-grid">
            <div class="chart-card"><button class="info-btn" onclick="showInfo('Total Balances', 'Overall score comparison.')">i</button><canvas id="balanceChart"></canvas></div>
            <div class="chart-card"><button class="info-btn" onclick="showInfo('Trend', 'Score evolution over time.')">i</button><canvas id="trendChart"></canvas></div>
        </div>
    </div>

    <div class="section">
        <h2>Player Leaderboard</h2>
        <table>
            <thead><tr><th>Player</th><th>Balance</th><th>Form</th><th>Win Rate</th></tr></thead>
            <tbody id="balanceBody"></tbody>
        </table>
    </div>
    
    <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>History</h2>
            <button class="btn-sec" style="font-size:0.7rem" onclick="undoMatch()">Undo Last</button>
        </div>
        <div id="historyLog"></div>
    </div>
</div>

<script>
    let players = JSON.parse(localStorage.getItem('players')) || {};
    let history = JSON.parse(localStorage.getItem('history')) || [];
    let activeMatch = JSON.parse(localStorage.getItem('activeMatch')) || null;
    let theme = localStorage.getItem('theme') || 'light';
    let chartObjects = {};

    // --- Theme & UI ---
    function toggleTheme() {
        theme = theme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        updateCharts(); // Redraw charts for visibility
    }
    document.documentElement.setAttribute('data-theme', theme);

    function showInfo(t, txt) { document.getElementById('popupTitle').innerText = t; document.getElementById('popupText').innerText = txt; document.getElementById('infoPopup').style.display = 'flex'; }
    function closePopup() { document.getElementById('infoPopup').style.display = 'none'; }

    // --- Timer Logic ---
    let timer, totalSeconds = 0, isRunning = false;
    function adjTimer(v) { totalSeconds = Math.max(0, totalSeconds + v); updateDisplay(); }
    function updateDisplay() { let s = totalSeconds; let h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; document.getElementById("display").innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
    function startStop() {
        const btn = document.getElementById("startStop");
        if(!isRunning) { 
            timer = setInterval(() => { if(totalSeconds > 0) { totalSeconds--; updateDisplay(); if(totalSeconds===0) alert("Time Up!"); } else { totalSeconds++; updateDisplay(); }}, 1000);
            isRunning = true; btn.innerText = "Pause";
        } else { clearInterval(timer); isRunning = false; btn.innerText = "Start"; }
    }
    function resetTimer() { clearInterval(timer); isRunning = false; totalSeconds = 0; updateDisplay(); document.getElementById("startStop").innerText = "Start"; }

    // --- Player Management & Selectors ---
    function syncSelectors(indexChanged) {
        let selects = [document.getElementById('p1S'), document.getElementById('p2S'), document.getElementById('p3S')];
        let values = selects.map(s => s.value);
        
        selects.forEach((s, idx) => {
            Array.from(s.options).forEach(opt => {
                // Disable option if it's selected in another dropdown
                opt.disabled = values.some((val, vIdx) => vIdx !== idx && val === opt.value);
            });
        });
        activeMatch.pNames = values;
        refreshMatchUI();
    }

    function populateSelectors() {
        let names = Object.keys(players);
        ['p1S','p2S','p3S'].forEach((id, i) => {
            let s = document.getElementById(id);
            s.innerHTML = '';
            names.forEach(n => {
                let opt = document.createElement('option');
                opt.value = n; opt.innerText = n;
                if(activeMatch.pNames[i] === n) opt.selected = true;
                s.appendChild(opt);
            });
        });
        syncSelectors(-1);
    }

    // --- Match Logic ---
    function showGameUI() {
        let names = Object.keys(players); if(names.length < 3) return alert("Add 3 players!");
        document.getElementById('gameSection').classList.remove('hidden');
        if(!activeMatch) activeMatch = { pNames: [names[0], names[1], names[2]], round: 1, tally: [0,0,0], rounds: [] };
        populateSelectors();
        refreshMatchUI();
    }

    function step(id, v) { let el = document.getElementById(id); el.value = (parseInt(el.value)||0) + v; }

    function refreshMatchUI() {
        if(!activeMatch) return;
        ['h1','h2','h3','l1','l2','l3'].forEach((id, i) => document.getElementById(id).innerText = activeMatch.pNames[i % 3]);
        document.getElementById('roundTitle').innerText = `Round ${activeMatch.round}`;
        ['t1','t2','t3'].forEach((id, i) => document.getElementById(id).innerText = activeMatch.tally[i]);
        
        let logs = document.getElementById('roundLogs'); logs.innerHTML = '';
        activeMatch.rounds.forEach((rd, idx) => {
            let row = logs.insertRow();
            row.insertCell(0).innerText = `R${idx+1}`;
            rd.forEach((score, sIdx) => {
                let cell = row.insertCell(sIdx + 1);
                cell.innerText = score;
                if(score === Math.max(...rd)) cell.className = 'score-high';
                if(score === Math.min(...rd)) cell.className = 'score-low';
            });
        });
        chartObjects.match.data.labels = activeMatch.pNames;
        chartObjects.match.data.datasets[0].data = activeMatch.tally;
        chartObjects.match.update();
        save();
    }

    function submitRound() {
        let v = [parseInt(document.getElementById('v1').value), parseInt(document.getElementById('v2').value), parseInt(document.getElementById('v3').value)];
        if(v.reduce((a,b)=>a+b, 0) !== 5) return alert("Sum must be 5!");
        activeMatch.rounds.push([...v]);
        v.forEach((s, i) => activeMatch.tally[i] += s);
        if(activeMatch.round < 3) { activeMatch.round++; refreshMatchUI(); } else { finishMatch(); }
    }

    function finishMatch() {
        let diffs = {};
        let maxScore = Math.max(...activeMatch.tally);
        activeMatch.pNames.forEach((n, i) => {
            let d = activeMatch.tally[i] - 5;
            players[n] += d;
            diffs[n] = d;
        });
        
        history.push({
            log: `${activeMatch.pNames.map((n,i)=>`${n}(${activeMatch.tally[i]})`).join(', ')}`,
            winner: activeMatch.pNames[activeMatch.tally.indexOf(maxScore)],
            diffs,
            rounds: [...activeMatch.rounds]
        });

        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        activeMatch = null;
        document.getElementById('gameSection').classList.add('hidden');
        save();
    }

    // --- Analytics ---
    function getWinRate(name) {
        let matches = history.filter(h => h.diffs.hasOwnProperty(name));
        if(matches.length === 0) return "0%";
        let wins = matches.filter(h => h.winner === name).length;
        return Math.round((wins / matches.length) * 100) + "%";
    }

    function getForm(name) {
        let last = history.filter(h => h.diffs.hasOwnProperty(name)).slice(-1)[0];
        if(!last) return "-";
        return last.diffs[name] > 0 ? "<span class='positive'>↑</span>" : (last.diffs[name] < 0 ? "<span class='negative'>↓</span>" : "=");
    }

    // --- Data ---
    function save() {
        localStorage.setItem('players', JSON.stringify(players));
        localStorage.setItem('history', JSON.stringify(history));
        localStorage.setItem('activeMatch', JSON.stringify(activeMatch));
        renderBalance(); renderHistory(); updateCharts();
    }
    function addPlayer() { let n = document.getElementById('playerName').value.trim(); if(n && !players[n]){ players[n]=0; save(); document.getElementById('playerName').value=''; } }
    function renderBalance() {
        let b = document.getElementById('balanceBody'); b.innerHTML = '';
        Object.keys(players).sort().forEach(n => {
            let r = b.insertRow();
            r.insertCell(0).innerText = n;
            let bal = r.insertCell(1); bal.innerText = players[n]; bal.className = players[n] >= 0 ? 'positive' : 'negative';
            r.insertCell(2).innerHTML = getForm(n);
            r.insertCell(3).innerText = getWinRate(n);
        });
    }
    function renderHistory() {
        document.getElementById('historyLog').innerHTML = history.slice(-10).reverse().map(h => 
            `<div style="padding:8px; border-bottom:1px solid var(--border)">
                <strong>${h.log}</strong> 
                <span class="win-badge">${h.winner ? '🏆 ' + h.winner : ''}</span>
                <div style="font-size:0.7rem; opacity:0.7">${JSON.stringify(h.rounds)}</div>
            </div>`
        ).join('');
    }
    function undoMatch() { if(history.length){ let l = history.pop(); for(let n in l.diffs) players[n] -= l.diffs[n]; save(); }}
    function copyJSON() { navigator.clipboard.writeText(JSON.stringify({players, history})); alert("Data copied to clipboard!"); }
    function exportData() { let blob = new Blob([JSON.stringify({players, history})], {type:'application/json'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download='game_backup.json'; a.click(); }
    function importData(e) {
        let reader = new FileReader(); reader.onload = (ev) => {
            let d = JSON.parse(ev.target.result); players = d.players; history = d.history; save(); location.reload();
        }; reader.readAsText(e.target.files[0]);
    }
    function clearSession() { if(confirm("Wipe all data?")) { localStorage.clear(); location.reload(); }}

    // --- Charts ---
    function initCharts() {
        const opt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: theme==='dark'?'#fff':'#000' } } } };
        chartObjects.balance = new Chart(document.getElementById('balanceChart'), { type: 'bar', data: { labels: [], datasets: [{ label: 'Balance', data: [], backgroundColor: '#3498db' }] }, options: opt });
        chartObjects.trend = new Chart(document.getElementById('trendChart'), { type: 'line', data: { labels: [], datasets: [] }, options: opt });
        chartObjects.match = new Chart(document.getElementById('matchChart'), { type: 'radar', data: { labels: [], datasets: [{ label: 'Score', data: [], borderColor: '#27ae60' }] }, options: opt });
    }
    function updateCharts() {
        const ns = Object.keys(players).sort();
        chartObjects.balance.data.labels = ns; chartObjects.balance.data.datasets[0].data = ns.map(n => players[n]);
        chartObjects.balance.update();
        
        chartObjects.trend.data.labels = history.map((_, i) => i + 1);
        chartObjects.trend.data.datasets = ns.map((n, idx) => {
            let cur = 0;
            return { label: n, data: history.map(h => cur += (h.diffs[n] || 0)), borderColor: `hsl(${idx*100}, 70%, 50%)`, tension: 0.3 };
        });
        chartObjects.trend.update();
    }

    initCharts(); save();
    if(activeMatch) showGameUI();
</script>
</body>
</html>
